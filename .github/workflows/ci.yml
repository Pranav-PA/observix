name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Internal errors must fail the build rather than being logged and swallowed.
  OBSERVIX_STRICT: "1"

# Every job creates a uv-managed venv and runs through `uv run`.
# `uv pip install --system` targets the runner's Debian system Python, which is
# PEP 668 externally-managed and refuses the install.

jobs:
  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          - python-version: "3.12"
            os: windows-latest
          - python-version: "3.12"
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Create the environment
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install
        run: uv pip install -e ".[dev]"

      - name: Test
        run: uv run pytest --cov=observix --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
        continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev]"
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy

  examples:
    name: examples run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev]"
      - name: Run every example
        run: |
          for f in examples/*.py; do
            echo "::group::$f"
            uv run python "$f" > /dev/null || exit 1
            echo "::endgroup::"
          done

  live:
    name: live backend verification
    runs-on: ubuntu-latest
    # Verifies that Phoenix actually accepts and understands what the
    # OpenInference dialect emits. In-memory tests cannot catch a mapping the
    # backend silently ignores --- exactly how the project-routing bug hid.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv venv --python 3.12

      - name: Install observix and Phoenix
        run: uv pip install -e ".[dev]" arize-phoenix

      - name: Start Phoenix
        run: |
          nohup uv run phoenix serve > phoenix.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:6006/healthz > /dev/null; then
              echo "Phoenix is up"; exit 0
            fi
            sleep 5
          done
          echo "Phoenix failed to start"; tail -50 phoenix.log; exit 1

      - name: Run live tests
        run: uv run pytest tests/live -m live -v

      - name: Phoenix logs on failure
        if: failure()
        run: tail -100 phoenix.log

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Build sdist and wheel
        run: uv build
      - name: Check metadata
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
