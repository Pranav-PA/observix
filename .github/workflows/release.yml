name: Release

# Publishes to PyPI when a version tag is pushed.
#
# Uses PyPI Trusted Publishing (OIDC) rather than a stored API token: PyPI
# verifies the workflow's identity directly, so there is no long-lived secret
# to leak or rotate. Configured at
# https://pypi.org/manage/account/publishing/ as:
#
#   project:      observix
#   owner:        Pranav-PA
#   repository:   observix
#   workflow:     release.yml
#   environment:  pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      test_pypi:
        description: "Publish to TestPyPI instead"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: verify before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev]"

      - name: Tests
        run: uv run --no-sync pytest
        env:
          OBSERVIX_STRICT: "1"

      - name: Lint and types
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync mypy

      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(uv run --no-sync python -c "import observix; print(observix.__version__)")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match __version__ $PKG"
            exit 1
          fi
          echo "Releasing $PKG"

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Build
        run: uv build

      - name: Check metadata
        run: uvx twine check --strict dist/*

      - name: Install the built wheel in a clean environment
        run: |
          uv venv --python 3.12 /tmp/fresh
          VIRTUAL_ENV=/tmp/fresh uv pip install dist/*.whl
          /tmp/fresh/bin/python -c "
          import observix
          from observix.providers import available_providers
          from observix.dialects import available_dialects
          print('version:', observix.__version__)
          assert available_providers(), 'provider entry points did not resolve'
          assert available_dialects(), 'dialect entry points did not resolve'
          observix.configure(service_name='smoke', exporters=['memory'],
                             set_global_tracer_provider=False)
          assert observix.is_configured()
          observix.shutdown()
          print('clean-install smoke test passed')
          "

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.test_pypi
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" dist/* \
            --title "${GITHUB_REF#refs/tags/}" \
            --notes "See [CHANGELOG.md](CHANGELOG.md) for details."
