name: Release

# Publishes to PyPI when a version tag is pushed.
#
# Uses PyPI Trusted Publishing (OIDC) rather than a stored API token: PyPI
# verifies the workflow's identity directly, so there is no long-lived secret
# to leak or rotate. Configure it once at
# https://pypi.org/manage/project/observix/settings/publishing/ with:
#
#   owner:            <your-github-org-or-user>
#   repository:       observix
#   workflow:         release.yml
#   environment:      pypi
#
# Until that is configured, the publish step will fail — by design.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      test_pypi:
        description: "Publish to TestPyPI instead"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: verify before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv pip install --system -e ".[dev]"

      - name: Tests
        run: pytest
        env:
          OBSERVIX_STRICT: "1"

      - name: Lint and types
        run: |
          ruff check .
          ruff format --check .
          mypy

      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(python -c "import observix; print(observix.__version__)")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match __version__ $PKG"
            exit 1
          fi
          echo "Releasing $PKG"

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12

      - name: Build
        run: uv build

      - name: Check metadata
        run: |
          uv pip install --system twine
          twine check --strict dist/*

      - name: Install the built wheel in a clean environment
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --quiet dist/*.whl
          /tmp/fresh/bin/python -c "
          import observix
          from observix.providers import available_providers
          from observix.dialects import available_dialects
          print('version:', observix.__version__)
          assert available_providers(), 'provider entry points did not resolve'
          assert available_dialects(), 'dialect entry points did not resolve'
          observix.configure(service_name='smoke', exporters=['memory'],
                             set_global_tracer_provider=False)
          assert observix.is_configured()
          observix.shutdown()
          print('clean-install smoke test passed')
          "

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.test_pypi
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" dist/* \
            --title "${GITHUB_REF#refs/tags/}" \
            --notes "See [CHANGELOG.md](CHANGELOG.md) for details."
